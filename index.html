<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1f6feb" />
  <title>Сканер товаров</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>Сканер товаров</h1>
  </header>

  <main class="app-content">
    <!-- Вкладка: Товары -->
    <section id="tab-products" class="tab-panel">
      <div class="toolbar">
        <input id="search" type="search" placeholder="Поиск по названию или штрихкоду" />
      </div>
      <div id="product-list" class="product-grid"></div>
      <p id="empty-products" class="empty-hint" hidden>Товаров пока нет. Добавьте через вкладку «Добавить товар».</p>
    </section>

    <!-- Вкладка: Добавить товар -->
    <section id="tab-add" class="tab-panel" hidden>
      <div class="scanner-block">
        <div class="scanner-viewport">
          <video id="scanner-video" playsinline muted></video>
          <div class="scan-overlay">
            <div class="scan-line"></div>
          </div>
        </div>
        <div class="scanner-controls">
          <button id="btn-start-scan" class="btn btn-primary">Запустить сканер</button>
          <button id="btn-stop-scan" class="btn" hidden>Остановить</button>
        </div>
        <p class="hint">Наведите камеру на штрихкод. Или введите код вручную:</p>
        <div class="manual-row">
          <input id="manual-barcode" type="text" inputmode="numeric" placeholder="Штрихкод вручную" />
          <button id="btn-use-manual" class="btn">Ввести</button>
        </div>
      </div>

      <!-- Форма товара (появляется после сканирования) -->
      <form id="product-form" class="product-form" hidden>
        <h2>Новый товар</h2>
        <label class="field">
          <span>Штрихкод</span>
          <input id="form-barcode" type="text" readonly />
        </label>
        <label class="field">
          <span>Название товара</span>
          <input id="form-name" type="text" placeholder="Например: Молоко 1л" required />
        </label>
        <label class="field">
          <span>Фото товара</span>
          <input id="form-photo" type="file" accept="image/*" capture="environment" />
          <div id="photo-preview" class="photo-preview"></div>
        </label>
        <div class="form-actions">
          <button type="button" id="btn-cancel-form" class="btn">Отмена</button>
          <button type="submit" class="btn btn-primary">Сохранить товар</button>
        </div>
      </form>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="products">
      <span class="nav-icon">▣</span>
      <span>Товары</span>
    </button>
    <button class="nav-btn" data-tab="add">
      <span class="nav-icon">＋</span>
      <span>Добавить товар</span>
    </button>
  </nav>

  <div id="toast" class="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
